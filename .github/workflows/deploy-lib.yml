name: Build node contract

on:
  push:
    branches: [main]
    paths:
      - 'libs/contract/**'
      - '.github/workflows/deploy-lib.yml'
  pull_request:
    branches: [main]
    paths:
      - 'libs/contract/**'
      - '.github/workflows/deploy-lib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-package-lock --ignore-scripts
      - run: npm run prepublish
